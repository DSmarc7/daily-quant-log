name: Daily arXiv q-fin tracker

on:
  schedule:
    # 07:00 UTC — décalé du market-tracker pour étaler les commits
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch arXiv papers
        run: python arxiv-tracker/fetch.py

      - name: Commit & push
        run: |
          git config user.name "Marc-Antoine DA SILVA"
          git config user.email "95468047+DSmarc7@users.noreply.github.com"
          git add arxiv-tracker/papers
          if git diff --cached --quiet; then
            echo "No new papers to commit"
          else
            git commit -m "arxiv: q-fin snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
