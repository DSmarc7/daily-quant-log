name: Daily Fear & Greed snapshot

on:
  schedule:
    # 08:30 UTC — étalé pour avoir des commits à des heures différentes
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Fear & Greed index
        run: python fear-greed/fetch.py

      - name: Commit & push
        run: |
          git config user.name "Marc-Antoine DA SILVA"
          git config user.email "95468047+DSmarc7@users.noreply.github.com"
          git add fear-greed/data
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "fear-greed: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
